##: Kitty Config

##:  fonts:   0xProto Nerd Font Mono, Andale Mono, CaskaydiaCove Nerd Font Mono, Courier New, 
# FiraCode Nerd Font Mono, GoMono Nerd Font Mono, Hack Nerd Font Mono, Input, Lilex Nerd Font Mono,
# MesloLGM Nerd Font Mono, Monaco, MonaspiceAr Nerd Font Mono, MonaspiceKr Nerd Font Mono,
# MonaspiceNe Nerd Font Mono, MonaspiceRn Nerd Font Mono, MonaspiceXe Nerd Font Mono, PT Mono,
# Operator Mono, SpaceMono Nerd Font Mono, UbuntuMono Nerd Font Mono, VictorMono Nerd Font Mono

##: Font
font_family                  0xProto Nerd Font Mono
font_size                    14.0
disable_ligatures            always
text_fg_override_threshold   0
modify_font cell_height      +0px

##: Cursor
cursor                       #cccccc
cursor_text_color            background
cursor_shape                 beam
cursor_beam_thickness        1.5
cursor_blink_interval        -1
cursor_stop_blinking_after   15.0
scrollback_lines             10000

##: Mouse and Bell
mouse_hide_wait              0
url_color                    #0087bd
url_style                    straight
open_url_with                default
url_prefixes                 ftp ftps git http https kitty mailto sftp ssh
detect_urls                  yes
show_hyperlink_targets       yes
strip_trailing_spaces        never
enable_audio_bell            no
window_alert_on_bell         no
visual_bell_duration         0
window_alert_on_bell         no
bell_path                    none

##: Window and Layout
remember_window_size         yes
initial_window_width         640
initial_window_height        400
enabled_layouts              Horizontal,Grid,Stack
window_resize_step_cells     4
window_resize_step_lines     2
window_border_width          0pt
draw_minimal_borders         yes
window_margin_width          0
single_window_margin_width   -1
window_padding_width         10
placement_strategy           center
active_border_color          #5A5A5A
inactive_border_color        #030303
inactive_text_alpha          0.8
hide_window_decorations      titlebar-only
confirm_os_window_close      0

##: Color scheme
#foreground                  #FEFEFE
#background                  #010101
background_opacity           1
background_blur              12
dynamic_background_opacity   yes
background_tint              0.85
dim_opacity                  0.9
selection_foreground         #000000
selection_background         #fffacd

##: Normal, then bold color pairs: 
##: black, red, green, yellow, blue, magenta, cyan, white
color0                       #000000
color8                       #767676
color1                       #cc0403
color9                       #f2201f
color2                       #19cb00
color10                      #23fd00
color3                       #cecb00
color11                      #fffd00
color4                       #0d73cc
color12                      #1a8fff
color5                       #cb1ed1
color13                      #fd28ff
color6                       #0dcdcd
color14                      #14ffff
color7                       #dddddd
color15                      #ffffff

##: Advanced
include                      ./envkitty.conf
# shell                      /opt/homebrew/bin/bash
# editor                     /opt/homebrew/bin/micro
allow_remote_control         yes
shell_integration            disabled
allow_cloning                ask

##: OS specific tweaks
# wayland_titlebar_color     system
# macos_titlebar_color       system
macos_option_as_alt          yes
macos_window_resizable       yes
macos_show_window_title_in   none
macos_custom_beam_cursor     yes
macos_colorspace             displayp3
# linux_display_server       auto

##: Keybindings
#: Set kitty_mod
kitty_mod                    ctrl+shift
#: Open/close kitty window
map kitty_mod+enter          launch
map kitty_mod+alt+enter      launch --cwd=home
map kitty_mod+w              close_window
#: New OS window
map kitty_mod+n              new_os_window_with_cwd
#: Next/prev kitty window
map kitty_mod+]              next_window
map kitty_mod+[              previous_window
#: Move active kitty window
map kitty_mod+f              move_window_forward
map kitty_mod+b              move_window_backward
#: Resize window
map kitty_mod+r              start_resizing_window
#: Switch to window by num
map kitty_mod+1              first_window
map kitty_mod+2              second_window
map kitty_mod+3              third_window
#: Cycle Next layout
map kitty_mod+alt+l          next_layout
#: +/-/reset font size
map kitty_mod+equal          change_font_size all +1.0
map kitty_mod+minus          change_font_size all -1.0
map kitty_mod+alt+equal      change_font_size all +10.0
map kitty_mod+alt+minus      change_font_size all -10.0
map cmd+0                    change_font_size all 0
#: Show docs
map kitty_mod+f1             show_kitty_doc overview
#: Toggle fullscreen
map kitty_mod+f11            toggle_fullscreen
#: Edit config file
map kitty_mod+,              edit_config_file
#: Reload kitty.conf
map kitty_mod+alt+,          load_config_file
#: Load alternate config
map ctrl+alt+,               load_config ~/.config/kitty/altconfig/kitty.conf
#: Open kitty shell
map kitty_mod+escape         kitty_shell window
#: +/- background opacity
map kitty_mod+alt+up         set_background_opacity +0.02
map kitty_mod+alt+down       set_background_opacity -0.02
#: Overlay
map kitty_mod+.              launch --type=overlay screen -d -RR gotop /opt/homebrew/bin/gotop
#: Quit kitty
map cmd+q                    quit
#: Audit current config
map kitty_mod+alt+u          debug_config
#: Zoom to k-window
map ctrl+k                   kitten zoom_toggle.py

##: include theme
include                      ./theme.conf
include                      ./bg.conf
